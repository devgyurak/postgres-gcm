# SPDX-License-Identifier: PostgreSQL
# Static checks that need no PostgreSQL server: the agent adapters, the architecture
# boundaries, action pins, the specification's test vectors, shell and Python lint.
# Never path-filtered.
name: lint

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned tools
        run: |
          python3 -m pip install --quiet \
            -r scripts/requirements-lint.txt \
            -r tests/e2e/requirements.txt \
            -r tests/load/requirements.txt
      - name: Agent adapters are in sync with their sources
        run: scripts/agents-sync.sh --check
      - name: Actions are pinned by commit
        run: python3 scripts/check-action-pins.py
      - name: Architecture boundaries
        run: python3 scripts/check-architecture.py
      - name: Spec vectors reproduce
        run: python3 scripts/check-vectors.py
      - name: The vector check notices a broken file
        run: python3 scripts/check-vectors.py --self-test
      - name: The end-to-end gate refuses what it must
        run: python3 tests/e2e/run.py --self-test
      - name: The load gate refuses what it must
        run: python3 tests/load/run.py --self-test
      - name: The release guard refuses what it must
        run: python3 scripts/release-guard.py --self-test
      - name: The SBOM is the shape it must be
        run: python3 scripts/sbom.py --self-test
      - name: The PGXN metadata satisfies the specification and this repository
        run: python3 scripts/check-pgxn.py
      - name: The PGXN metadata check notices a broken document
        run: python3 scripts/check-pgxn.py --self-test
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/spike/*.sh .claude/hooks/*.sh tests/e2e/*.sh
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: |
          # tests/e2e and tests/load each hold a run.py; two invocations keep the module names apart.
          mypy --strict scripts/*.py .claude/hooks/*.py tests/e2e/*.py
          mypy --strict tests/load/*.py
      - name: actionlint
        run: actionlint
