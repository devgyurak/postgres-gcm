# SPDX-License-Identifier: PostgreSQL
# The end-to-end suite for every image of docker/versions.json: a primary, a streaming
# replica taken from it and a runner that only issues SQL (tests/e2e, scripts/e2e.sh) — the
# round trip, the Korean LIKE, deterministic joins, a forged tag and NULL arguments, on the
# node that sealed the rows and on the one that only replayed them.
#
# Not a required check: on a pull request it runs only when something it tests has changed.
# The required SQL checks are in regress.yml, which is never path-filtered.
name: e2e

on:
  pull_request:
    paths:
      - "src/**"
      - "sql/**"
      - "Makefile"
      - "pg_gcm.control"
      - "tests/e2e/**"
      - "scripts/e2e.sh"
      - "scripts/build-in-docker.sh"
      - "scripts/lib.sh"
      - "scripts/ci-matrix.py"
      - "docker/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      all: ${{ steps.list.outputs.all }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: list
        run: echo "all=$(python3 scripts/ci-matrix.py all)" >>"$GITHUB_OUTPUT"

  e2e:
    needs: images
    name: e2e (${{ matrix.entry.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.images.outputs.all) }}
    env:
      IMAGE: ${{ matrix.entry.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build
        run: scripts/build-in-docker.sh "$IMAGE"
      # The runner's exit status is the gate: 0 only when a scenario ran and every one passed.
      - name: End-to-end suite
        run: scripts/e2e.sh "$IMAGE"
