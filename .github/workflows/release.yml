# SPDX-License-Identifier: PostgreSQL
# The release pipeline: guard the tag, build and package the supported majors on both
# architectures, build and smoke the distribution server image, then checksum, SBOM, sign and
# publish. A
# workflow_dispatch run is a dry run — it exercises all of that and publishes nothing
# (.agents/skills/ci-release.md). Tags are SemVer vMAJOR.MINOR.PATCH on main.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch main
        if: github.event_name == 'push'
        run: git fetch --no-tags origin main
      - name: Guard the tag and the changelog
        if: github.event_name == 'push'
        run: |
          on_main=false
          if git merge-base --is-ancestor "$GITHUB_REF_NAME" origin/main; then on_main=true; fi
          python3 scripts/release-guard.py --tag "$GITHUB_REF_NAME" --on-main "$on_main"
      - id: version
        run: echo "version=$(python3 scripts/release-guard.py --print-version)" >>"$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      supported: ${{ steps.list.outputs.supported }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: list
        # Only the supported majors ship: the pre-release is not a release, and the OpenSSL floor
        # (17-bookworm) is a build-time check of the oldest libcrypto, not a second pg17 artifact.
        run: echo "supported=$(python3 scripts/ci-matrix.py supported)" >>"$GITHUB_OUTPUT"

  package:
    needs: [guard, images]
    name: package (${{ matrix.entry.label }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.images.outputs.supported) }}
        arch: [amd64, arm64]
    env:
      IMAGE: ${{ matrix.entry.image }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build
        run: scripts/build-in-docker.sh "$IMAGE"
      # package.sh refuses a build older than the sources and writes the tarball and its .sha256.
      - name: Package
        run: scripts/package.sh "$IMAGE" "$ARCH" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pg_gcm-${{ matrix.entry.image }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  server:
    needs: [guard, images]
    # Only this job pushes to ghcr.io, so only it needs packages: write.
    permissions:
      contents: read
      packages: write
    name: server (${{ matrix.entry.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.images.outputs.supported) }}
    env:
      IMAGE: ${{ matrix.entry.image }}
      TAG: ghcr.io/${{ github.repository_owner }}/pg_gcm:${{ needs.guard.outputs.version }}-pg${{ matrix.entry.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the extension
        run: scripts/build-in-docker.sh "$IMAGE"
      - name: Build the server image
        run: scripts/server-image.sh "$IMAGE" "$TAG"
      # The Korean LIKE round trip against the image's own init, before anything is pushed.
      - name: Smoke the server image
        run: scripts/smoke-image.sh "$TAG"
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push the server image
        if: github.event_name == 'push'
        run: docker push "$TAG"

  publish:
    needs: [guard, package, server]
    if: github.event_name == 'push'
    permissions:
      contents: write # create the GitHub release
      id-token: write # cosign keyless signing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum pg_gcm-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: SBOM
        run: |
          python3 scripts/sbom.py \
            --output "dist/pg_gcm-${{ needs.guard.outputs.version }}.sbom.cdx.json" \
            --version "${{ needs.guard.outputs.version }}" dist/pg_gcm-*.tar.gz
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign the checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes
